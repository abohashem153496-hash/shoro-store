<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHORO | لوحة التحكم الإدارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-6 md:p-12">

    <div class="max-w-xl mx-auto bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
            <h2 class="text-2xl font-black text-amber-500">⚙️ لوحة التحكم السحابية</h2>
            <a href="index.html" target="_blank" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg transition">عرض الموقع 🌐</a>
        </div>
        <p class="text-zinc-400 text-sm mb-6">أضف صنف جديد وسيتم تحديثه فوراً في قاعدة البيانات وسيحس به كل العملاء.</p>
        
        <form id="add-item-form" onsubmit="addNewItemToFirebase(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">اسم الصنف:</label>
                <input type="text" id="item-name" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none" placeholder="مثال: بيتزا سوبر شورو">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">القسم:</label>
                <select id="item-category" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    <option value="pizza">بيتزا</option>
                    <option value="broast">بروست</option>
                    <option value="grills">مشاوي</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">السعر (ر.س):</label>
                <input type="number" id="item-price" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none" placeholder="50">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">وصف الصنف:</label>
                <textarea id="item-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none" placeholder="المكونات..."></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">حفظ وإضافة الصنف في الموقع</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addNewItemToFirebase = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري الحفظ والتحديث...";

            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const price = document.getElementById('item-price').value;
            const desc = document.getElementById('item-desc').value;

            try {
                await addDoc(collection(db, "menu_items"), {
                    name,
                    category,
                    price,
                    desc,
                    createdAt: new Date()
                });

                alert('✅ تم إضافة الصنف بنجاح وظهر الآن في الموقع الرئيسي للعملاء!');
                document.getElementById('add-item-form').reset();
            } catch (e) {
                console.error("خطأ أثناء الإضافة: ", e.message);
                alert('حدث خطأ أثناء الحفظ، تأكد من إعدادات القواعد في فايربيس.');
            } finally {
                btn.innerText = "حفظ وإضافة الصنف في الموقع";
            }
        }
    </script>
</body>
</html>
