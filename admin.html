<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHORO | لوحة التحكم الإدارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-6 md:p-12">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl mt-20">
        <h2 class="text-2xl font-black text-amber-500 mb-6 text-center">🔐 تسجيل الدخول لوحة التحكم</h2>
        <form onsubmit="checkLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">كلمة المرور:</label>
                <input type="password" id="admin-pass" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-3 focus:border-amber-500 focus:outline-none" placeholder="اكتب 1234">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">دخول</button>
        </form>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="max-w-4xl mx-auto space-y-8 hidden">
        <div class="flex justify-between items-center bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h2 class="text-2xl font-black text-amber-500">⚙️ لوحة التحكم السحابية الفورية</h2>
            <a href="index.html" target="_blank" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg transition">عرض الموقع 🌐</a>
        </div>

        <!-- 1. إضافة منتج جديد مع دعم رفع عدة صور -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">🍔 إضافة منتج جديد (مع إمكانية رفع عدة صور)</h3>
            <form id="add-item-form" onsubmit="addItem(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم الصنف:</label>
                        <input type="text" id="item-name" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">القسم:</label>
                        <select id="item-category" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                            <option value="pizza">بيتزا</option>
                            <option value="broast">بروست</option>
                            <option value="grills">مشاوي</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">السعر (ر.س):</label>
                        <input type="number" id="item-price" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">صور المنتج (اختر صورة أو عدة صور):</label>
                        <input type="file" id="item-images-file" accept="image/*" multiple class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm file:bg-amber-500 file:text-zinc-950 file:border-0 file:rounded-md file:px-3 file:py-1 file:font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف الصنف:</label>
                    <textarea id="item-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-item" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">إضافة ونشر المنتج فوراً</button>
            </form>
        </div>

        <!-- 2. إضافة عرض جديد -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">🔥 إضافة عرض جديد وتحديد وقت انتهائه</h3>
            <form id="add-offer-form" onsubmit="addOffer(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">عنوان العرض:</label>
                        <input type="text" id="offer-title" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">سعر العرض (ر.س):</label>
                        <input type="number" id="offer-price" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">صورة العرض:</label>
                        <input type="file" id="offer-image-file" accept="image/*" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm file:bg-red-500 file:text-white file:border-0 file:rounded-md file:px-3 file:py-1 file:font-bold">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">وقت انتهاء العرض:</label>
                        <input type="datetime-local" id="offer-time" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف العرض:</label>
                    <textarea id="offer-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-offer" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-500 transition">تفعيل ونشر العرض فوراً</button>
            </form>
        </div>

        <!-- 3. التحكم الشامل في الهوية والألوان والخطوط -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">🎨 التحكم الشامل في الهوية والخطوط والألوان</h3>
            <form id="settings-form" onsubmit="updateSettings(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم المطعم:</label>
                        <input type="text" id="set-brand" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none" value="SHORO شورو">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">نوع الخط:</label>
                        <select id="set-font" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                            <option value="Cairo">خط كايرو (Cairo)</option>
                            <option value="Tajawal">خط تجوال (Tajawal)</option>
                            <option value="Amiri">خط أميري (Amiri)</option>
                            <option value="Readex Pro">خط رادكس (Readex Pro)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">لون خلفية الموقع:</label>
                        <input type="color" id="set-bgcolor" value="#09090b" class="w-full h-10 bg-zinc-950 border border-zinc-700 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">لون النصوص:</label>
                        <input type="color" id="set-textcolor" value="#ffffff" class="w-full h-10 bg-zinc-950 border border-zinc-700 rounded-lg cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">العنوان الرئيسي:</label>
                    <input type="text" id="set-title" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none" value="قرمشة، طازجة، ومشوية عالفحم!">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">الوصف التعريفي:</label>
                    <textarea id="set-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">استمتع بأشهى أطباق البيتزا، البروست، والمشاوي المصنوعة بجودة عالية.</textarea>
                </div>
                <button type="submit" id="btn-settings" class="w-full bg-zinc-800 text-white font-bold py-3 rounded-lg hover:bg-zinc-700 transition">حفظ وتطبيق التعديلات فوراً</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "car-orders.firebaseapp.com",
            databaseURL: "https://car-orders-default-rtdb.firebaseio.com",
            projectId: "car-orders",
            storageBucket: "car-orders.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_PASS = "1234";

        window.checkLogin = function(event) {
            event.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if(pass === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            } else {
                alert('كلمة المرور غير صحيحة! (استخدم 1234)');
            }
        }

        // قراءة الصور مباشرة وبسرعة فائقة بدون ضغط معقد
        function readFileAsBase64(file) {
            return new Promise((resolve) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = () => resolve("");
            });
        }

        window.addItem = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-item');
            btn.innerText = "جاري النشر الفوري...";
            
            try {
                const fileInput = document.getElementById('item-images-file');
                let imageUrls = [];
                
                if (fileInput.files.length > 0) {
                    for (let i = 0; i < fileInput.files.length; i++) {
                        let base64Img = await readFileAsBase64(fileInput.files[i]);
                        if(base64Img) imageUrls.push(base64Img);
                    }
                }

                const newRef = push(ref(db, 'menu_items'));
                await set(newRef, {
                    name: document.getElementById('item-name').value,
                    category: document.getElementById('item-category').value,
                    price: document.getElementById('item-price').value,
                    images: imageUrls,
                    desc: document.getElementById('item-desc').value,
                    createdAt: Date.now()
                });

                alert('✅ تم نشر المنتج وصوره في نفس الثانية!');
                document.getElementById('add-item-form').reset();
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "إضافة ونشر المنتج فوراً";
            }
        }

        window.addOffer = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-offer');
            btn.innerText = "جاري نشر العرض...";
            
            try {
                const fileInput = document.getElementById('offer-image-file');
                let imageUrl = await readFileAsBase64(fileInput.files[0]);

                const newRef = push(ref(db, 'offers'));
                await set(newRef, {
                    title: document.getElementById('offer-title').value,
                    price: document.getElementById('offer-price').value,
                    image: imageUrl,
                    endTime: document.getElementById('offer-time').value,
                    desc: document.getElementById('offer-desc').value,
                    createdAt: Date.now()
                });

                alert('🔥 تم نشر العرض وتفعيله فوراً!');
                document.getElementById('add-offer-form').reset();
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "تفعيل ونشر العرض فوراً";
            }
        }

        window.updateSettings = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-settings');
            btn.innerText = "جاري الحفظ والتطبيق...";
            try {
                await set(ref(db, 'settings'), {
                    brandName: document.getElementById('set-brand').value,
                    heroTitle: document.getElementById('set-title').value,
                    heroDesc: document.getElementById('set-desc').value,
                    fontFamily: document.getElementById('set-font').value,
                    bgColor: document.getElementById('set-bgcolor').value,
                    textColor: document.getElementById('set-textcolor').value
                });
                alert('✅ تم تطبيق التعديلات وتحديث الموقع فوراً!');
            } catch(e) {
                alert('خطأ: ' + e.message);
            } finally {
                btn.innerText = "حفظ وتطبيق التعديلات فوراً";
            }
        }
    </script>
</body>
</html>
